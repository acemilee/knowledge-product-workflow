[project]
name = "knowledge-product-workflow"
version = "1.2.0"
description = "Host-driven, auditable workflow for Chinese knowledge-product delivery"
readme = "README.md"
requires-python = "==3.13.*"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai-agent", "claude-code", "codex", "knowledge-product", "quarto", "skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/acemilee/knowledge-product-workflow"
Repository = "https://github.com/acemilee/knowledge-product-workflow"
Issues = "https://github.com/acemilee/knowledge-product-workflow/issues"
Changelog = "https://github.com/acemilee/knowledge-product-workflow/blob/main/CHANGELOG.md"

[project.scripts]
kp = "knowledge_product_workflow.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_product_workflow = ["templates/*.md", "templates/*.qmd", "templates/pdf/*.tex", "templates/pdf/*.lua"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
