name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Check lockfile
        run: uv lock --check

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest -q
